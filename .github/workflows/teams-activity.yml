name: Teams activity

# Posts a Teams card for every push with new commits (any branch) and for every issue closed as
# completed, so the team sees the work as it happens. Setup: .github/scripts/teams/README.md
#
# Security: event text (commit messages, titles) is read by the script from GITHUB_EVENT_PATH with
# jq, never interpolated into this file. The script itself is always taken from the default branch.

on:
  push:
    branches: ["**"]
  issues:
    types: [closed]

permissions:
  contents: read

concurrency:
  group: teams-activity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  notify:
    if: ${{ !endsWith(github.actor, '[bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
      - name: Post to Teams
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: bash .github/scripts/teams/activity.sh
