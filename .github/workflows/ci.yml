name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Spreadsheet guard (no real personal data, #105)
        run: python3 .github/scripts/check_spreadsheets.py
      - name: Lint backend
        working-directory: backend
        run: npx eslint src/ --max-warnings 50
      - name: Lint frontend
        working-directory: frontend
        run: npx eslint src/ --max-warnings 780
      - name: Test deploy.sh (stubbed git remote, pnpm, pm2, curl)
        run: bash tests/deploy/deploy.test.sh
      - name: Test Teams reporting scripts (stubbed gh, curl)
        run: bash tests/teams/teams.test.sh

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Build and run test suite in Docker
        run: make citest
