name: Teams weekly report

# Client channel: Mondays 08:00 Europe/Stockholm. Setup and rules: .github/scripts/teams/README.md
# GitHub cron is UTC only, so the job is scheduled at 06:00 and 07:00 UTC; the script proceeds
# only in the run that lands on 08:00 Stockholm (CET or CEST). Scheduled runs can start late.

on:
  schedule:
    - cron: "0 6,7 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run = only print in the log · test-post = post a TEST card, change nothing · full = post (once per week), save state, archive Klar"
        type: choice
        options: [dry-run, test-post, full]
        default: dry-run

permissions:
  contents: write # the reports-state branch (state for dedup, accepted-items log, last snapshot)
  issues: read
  pull-requests: read

concurrency:
  group: teams-reports
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - name: Weekly report
        env:
          MODE: ${{ github.event_name == 'schedule' && 'full' || inputs.mode }}
          GH_TOKEN: ${{ github.token }}
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          PROJECT_GH_OWNER: "@me" # PROJECT_TOKEN belongs to the project owner
        run: bash .github/scripts/teams/weekly-report.sh
