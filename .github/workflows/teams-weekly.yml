name: Teams weekly status

# Posts the weekly progress card (Etapp 1/2 progress from the project board + the week's
# activity) to Microsoft Teams. Setup: .github/scripts/teams/README.md

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC = 07:00 Stockholm (08:00 in summer time)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only print the card in the log, don't post to Teams"
        type: boolean
        default: false

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  weekly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - name: Build and post the weekly card
        env:
          GH_TOKEN: ${{ github.token }}
          PROJECT_TOKEN: ${{ secrets.PROJECT_READ_TOKEN }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: bash .github/scripts/teams/weekly-report.sh
