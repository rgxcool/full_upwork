name: 🅿️ Parking lot idea
description: Capture an idea or request that is not yet scoped, quoted or scheduled.
title: "[Idea] "
labels: ["parking-lot"]
body:
  - type: markdown
    attributes:
      value: |
        Parking-lot items are **not** committed work. They are reviewed at sprint planning and either
        promoted to a *Scoped feature* (with a quote) or closed. No estimate needed yet.
  - type: textarea
    id: problem
    attributes:
      label: Problem / goal
      description: What workflow is painful today, and for whom?
      placeholder: "Coordinators re-type APL contact details from the contract PDF…"
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed idea
      description: Rough description of a solution. Screenshots or examples (e.g. from Itslearning / Alvis) welcome.
    validations:
      required: false
  - type: dropdown
    id: roles
    attributes:
      label: Affected roles
      multiple: true
      options:
        - Elev
        - Lärare
        - Administratör
        - Systemadministratör
        - SYV
        - Specialpedagog
        - Praktiksamordnare
    validations:
      required: true
  - type: dropdown
    id: etapp
    attributes:
      label: Target etapp
      options:
        - Etapp 1
        - Etapp 2
        - Later / unknown
    validations:
      required: true
  - type: dropdown
    id: urgency
    attributes:
      label: Business urgency
      options:
        - Nice to have
        - Important for next sprint
        - Business critical
    validations:
      required: true
  - type: dropdown
    id: size
    attributes:
      label: Gut-feel size (T-shirt)
      options:
        - "S (< 1 day)"
        - "M (1–3 days)"
        - "L (1–2 weeks)"
        - "XL (needs its own quote)"
        - "Don't know"
    validations:
      required: false
  - type: textarea
    id: blockers
    attributes:
      label: Decisions or external dependencies
      description: Vendor choice, credentials, legal/GDPR review, municipality rules…
      placeholder: "Needs SMS vendor + sender ID; needs Scrive API key…"
    validations:
      required: false
